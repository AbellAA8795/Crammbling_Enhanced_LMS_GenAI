<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="flawlessBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="#090d16" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="url(#flawlessBg)" filter="url(#shadow)"/>

  <!-- Central Shield Base -->
  <path d="M50 22C59 22 66 25 66 25C66 44 60 63 50 72C40 63 34 44 34 25C34 25 41 22 50 22Z" fill="#0f172a" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- The "Five" Stars / Diamonds Layout representing 5 Perfect Scores -->
  <polygon points="50,28 53,35 60,35 55,39 57,46 50,42 43,46 45,39 40,35 47,35" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1"/>
  
  <circle cx="38" cy="52" r="5" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1"/>
  <circle cx="62" cy="52" r="5" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1"/>
  <circle cx="44" cy="64" r="5" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1"/>
  <circle cx="56" cy="64" r="5" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1"/>
</svg>

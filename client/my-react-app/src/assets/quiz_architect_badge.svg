<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="architectGold" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="#291808" stroke="#facc15" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="url(#architectGold)" filter="url(#dropShadow)"/>

  <!-- Inner Obsidian Blueprint Board -->
  <circle cx="50" cy="50" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Blueprint Grid Lines -->
  <line x1="50" y1="20" x2="50" y2="80" stroke="#1e293b" stroke-width="1"/>
  <line x1="20" y1="50" x2="80" y2="50" stroke="#1e293b" stroke-width="1"/>

  <!-- Drafting Compass / Architectural Divider Icon -->
  <path d="M50 28L38 68M50 28L62 68" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="28" r="4" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
  <path d="M43 54h14" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Glowing Core Star/Node -->
  <circle cx="50" cy="54" r="3" fill="#facc15"/>

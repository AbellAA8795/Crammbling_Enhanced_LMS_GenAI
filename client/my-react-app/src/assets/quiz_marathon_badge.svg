<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="marathonBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="#011e17" stroke="#34d399" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="url(#marathonBg)" filter="url(#shadow)"/>

  <!-- Background Clock Dial (Representing "in one day" / Time constraint) -->
  <circle cx="50" cy="50" r="28" fill="#022c22" stroke="#047857" stroke-width="2"/>
  <path d="M50 26v4M50 70v4M26 50h4M70 50h4" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>

  <!-- Stack of Multiple Quiz Cards (Representing the "10 Quizzes" Volume) -->
  <!-- Back Card -->
  <rect x="36" y="38" width="28" height="34" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1.5" transform="rotate(-10 50 55)"/>
  <!-- Middle Card -->
  <rect x="36" y="36" width="28" height="34" rx="4" fill="#047857" stroke="#10b981" stroke-width="1.5" transform="rotate(5 50 53)"/>
  <!-- Front Focus Quiz Card -->
  <rect x="34" y="34" width="32" height="36" rx="5" fill="#0f172a" stroke="url(#cardGrad)" stroke-width="2"/>
  
  <!-- Content lines on the front quiz card -->
  <rect x="40" y="42" width="14" height="3" rx="1" fill="#34d399"/>
  <rect x="40" y="49" width="20" height="2" rx="1" fill="#94a3b8"/>
  <rect x="40" y="54" width="16" height="2" rx="1" fill="#94a3b8"/>

  <!-- Checkmark Stamp Overlay (Completed) -->
  <circle cx="58" cy="56" r="9" fill="#10b981" stroke="#fff" stroke-width="1.5"/>
  <path d="M54 56l3 3 5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
